plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    // Dev-only mods for testing compat (Sable, Create, Create Aeronautics). Modrinth's maven serves them by project slug + version number.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

dependencies {
    // runtimeOnly: on the run classpath only, never compiled against, so Blocky Siege still has no
    // hard (or build-time) dependency on any of these.
    runtimeOnly "maven.modrinth:sable:${sable_version}"
    runtimeOnly "maven.modrinth:create:${create_version}"
    runtimeOnly "maven.modrinth:create-aeronautics:${create_aeronautics_version}"
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            systemProperty('forge.logging.markers', 'REGISTRIES')
            logLevel = org.slf4j.event.Level.DEBUG
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            // ./gradlew :neoforge:runData writes into common/src/generated/resources so both loaders ship the output.
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', rootProject.file('common/src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}
