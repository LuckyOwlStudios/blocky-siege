# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Project
version=7.0.0
group=net.luckystudios
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
mod_id=blockysiege
mod_name=Blocky Siege
mod_author=LuckyOwl
license=All Rights Reserved
credits=
description=A mod that adds siege weapons to Minecraft.
## The vanilla Minecraft the 'common' project compiles against: https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
## https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric: https://fabricmc.net/develop/
fabric_version=0.116.6+1.21.1
fabric_loader_version=0.16.14

# NeoForge: https://projects.neoforged.net/neoforged/neoforge
# Dev/build version. Bumped to 21.1.267 because the dev-run mods below need 21.1.247+ (Create Aeronautics).
neoforge_version=21.1.267
neoforge_version_range=[21.1.139,)
neoforge_loader_version_range=[1,)

# Sable Companion (bundled library for Sable sub-level compat): https://github.com/ryanhcode/sable-companion
sable_companion_version=1.6.0

# Dev-only run mods for NeoForge (Modrinth maven version numbers)
sable_version=2.0.6+mc1.21.1
create_version=6.0.10+mc1.21.1
create_aeronautics_version=1.3.3+mc1.21.1
